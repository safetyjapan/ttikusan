<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>農業資材のご注文 — セーフティージャパン株式会社</title>
<style>
:root{
  --bg:#FBF8F0; --surface:#FFFFFF; --text:#1B1B1B; --sub:#3D3D3D;
  --border:#8A8272; --green:#1F6B35; --green-dk:#154D26; --green-lt:#E4F2E7;
  --amber:#FFE9A8; --amber-tx:#5A3B00; --red:#B3261E;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{font-size:20px}
body{font-family:"Hiragino Kaku Gothic ProN","Meiryo","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text);line-height:1.8;padding-bottom:110px}
a{color:var(--green-dk)}
button,select,input,textarea{font:inherit}
:focus-visible{outline:4px solid #0B57D0;outline-offset:2px}

header{background:var(--green);color:#fff;padding:18px 20px;border-bottom:6px solid var(--amber)}
.wrap{max-width:900px;margin:0 auto}
.h-name{font-size:1.3rem;font-weight:900}
.h-tel{font-size:1.5rem;font-weight:900;margin-top:4px}
.h-tel small{font-size:.85rem;font-weight:500;margin-left:8px}
.lead{background:var(--surface);border-bottom:2px solid var(--border);padding:22px 20px}
.lead h1{font-size:1.6rem;line-height:1.5;color:var(--green-dk)}
.lead p{margin-top:8px;font-size:1.05rem}

.cats{display:flex;flex-wrap:wrap;gap:10px;padding:18px 0 6px}
.cat{min-height:56px;padding:8px 20px;font-weight:700;border:3px solid var(--green);background:#fff;color:var(--green-dk);border-radius:12px;cursor:pointer}
.cat[aria-pressed="true"]{background:var(--green);color:#fff}

.grid{display:grid;gap:22px;padding:14px 0}
.card{background:var(--surface);border:3px solid var(--border);border-radius:16px;overflow:hidden}
.card.in{border-color:var(--green);box-shadow:0 0 0 4px var(--green-lt)}
.photo{height:210px;background:var(--green-lt);display:flex;align-items:center;justify-content:center;font-size:5rem}
.photo img{width:100%;height:100%;object-fit:contain;background:#fff}
.body{padding:18px 18px 8px}
.name{font-size:1.45rem;font-weight:900;line-height:1.4}
.pitch{margin-top:10px;padding:12px 14px;background:var(--amber);color:var(--amber-tx);font-size:1.15rem;font-weight:700;border-radius:10px;line-height:1.6}
.desc{margin-top:10px;font-size:1.05rem;color:var(--sub)}
.field{margin-top:14px}
.field label{display:block;font-weight:700;font-size:1rem;margin-bottom:4px}
select{width:100%;min-height:56px;padding:8px 12px;border:3px solid var(--border);border-radius:10px;background:#fff;font-size:1.1rem;font-weight:700}
.price{margin-top:14px;font-size:2rem;font-weight:900;color:var(--green-dk)}
.price small{font-size:1rem;font-weight:700;color:var(--sub);margin-left:4px}
.spec{font-size:1rem;color:var(--sub)}
.none{margin-top:14px;font-weight:900;color:var(--red);font-size:1.1rem}
.qty{display:flex;align-items:center;gap:10px;margin-top:14px}
.qty b{font-size:1.1rem;margin-right:4px}
.qb{width:60px;height:60px;border:3px solid var(--green);background:#fff;color:var(--green-dk);font-size:1.9rem;font-weight:900;border-radius:12px;cursor:pointer}
.qn{width:84px;height:60px;text-align:center;border:3px solid var(--border);border-radius:12px;font-size:1.5rem;font-weight:900}
.foot{padding:12px 18px 18px;display:grid;gap:10px}
.btn{min-height:64px;width:100%;border:none;border-radius:14px;font-size:1.25rem;font-weight:900;cursor:pointer;background:var(--green);color:#fff}
.btn:hover{background:var(--green-dk)}
.btn.in{background:#fff;color:var(--green-dk);border:3px solid var(--green)}
.btn:disabled{background:#CFCFCF;color:#555;cursor:not-allowed}
.link{display:block;text-align:center;padding:14px;font-weight:700;border:3px solid var(--border);border-radius:14px;text-decoration:none;color:var(--text)}

/* 画面下の固定カートバー */
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:4px solid var(--green);padding:10px 16px;z-index:50}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
.bar-info{font-weight:900;font-size:1.15rem}
.bar-info span{display:block;font-size:.9rem;font-weight:500;color:var(--sub)}
.bar .btn{width:auto;min-width:190px;padding:0 20px}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:16px}
.ov.open{display:flex}
.modal{background:#fff;border-radius:16px;max-width:640px;width:100%;padding:22px}
.modal h2{font-size:1.5rem;color:var(--green-dk);margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:2px dashed var(--border);font-size:1.05rem}
.row .n{font-weight:900}
.row .t{font-weight:900;white-space:nowrap}
.del{margin-top:6px;min-height:48px;padding:0 16px;border:3px solid var(--red);color:var(--red);background:#fff;border-radius:10px;font-weight:700;cursor:pointer}
.tot{display:flex;justify-content:space-between;font-size:1.5rem;font-weight:900;padding:14px 0;color:var(--green-dk)}
.sub{display:flex;justify-content:space-between;font-size:1rem;color:var(--sub)}
.f{margin-top:14px}
.f label{display:block;font-weight:900;margin-bottom:4px}
.req{background:var(--red);color:#fff;font-size:.8rem;padding:2px 8px;border-radius:6px;margin-left:6px}
.f input,.f textarea{width:100%;min-height:56px;padding:10px 12px;border:3px solid var(--border);border-radius:10px;font-size:1.1rem}
.f textarea{min-height:100px}
.btns{display:grid;gap:10px;margin-top:18px}
.btn.gray{background:#fff;color:var(--text);border:3px solid var(--border)}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:#222;color:#fff;font-weight:900;font-size:1.1rem;padding:16px 24px;border-radius:12px;z-index:200;display:none;max-width:90vw;text-align:center}
.toast.show{display:block}
footer{padding:24px 20px;font-size:1rem;color:var(--sub);text-align:center}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="h-name" id="coName"></div>
  <div class="h-tel">📞 <span id="coTel"></span><small id="coHours"></small></div>
</div></header>

<section class="lead"><div class="wrap">
  <h1>農家のみなさまへ。<br>必要な資材を、そのまま注文できます。</h1>
  <p>下の「カートに入れる」を押して、いちばん下の「注文へ進む」を押すだけです。わからないときは、上のお電話番号までどうぞ。</p>
</div></section>

<main class="wrap">
  <div class="cats" id="cats" role="group" aria-label="商品の種類"></div>
  <div class="grid" id="grid"></div>
</main>

<footer id="coFoot"></footer>

<div class="bar"><div class="wrap">
  <div class="bar-info"><span>カートの中身</span><b id="barText">0点</b></div>
  <button class="btn" onclick="openForm()">注文へ進む</button>
</div></div>

<div class="ov" id="ov"><div class="modal">
  <h2>ご注文の内容</h2>
  <div id="sum"></div>
  <div class="f"><label>会社名・屋号（お名前でも可）<span class="req">必須</span></label><input id="fCompany" autocomplete="organization"></div>
  <div class="f"><label>ご担当者名<span class="req">必須</span></label><input id="fName" autocomplete="name"></div>
  <div class="f"><label>メールアドレス<span class="req">必須</span></label><input id="fEmail" type="email" autocomplete="email"></div>
  <div class="f"><label>お電話番号</label><input id="fTel" type="tel" autocomplete="tel"></div>
  <div class="f"><label>お届け先の住所</label><input id="fAddress" autocomplete="street-address"></div>
  <div class="f"><label>ご希望の日・ひとこと</label><textarea id="fNote"></textarea></div>
  <div class="btns">
    <button class="btn" onclick="submitOrder()">この内容で注文する</button>
    <button class="btn gray" onclick="closeForm()">戻って商品を見る</button>
  </div>
</div></div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ===== 設定 ===== */
// 農業用に新しく作ったスプレッドシート／Apps Scriptの /exec URL を入れてください。
// 空欄の間は下の SAMPLE を表示し、注文はコンソールに出るだけです（送信されません）。
const CONFIG = { GAS_URL: '' };
const TAX = 0.10;
const COMPANY = {
  name:'セーフティージャパン株式会社',
  tel:'0995-57-7171', hours:'平日9時～17時',
  address:'〒899-4302　鹿児島県霧島市国分台明寺字下村777-7',
  email:'safetyjapan.mk@gmail.com'
};

/* ===== 商品データ（サンプル） =====
   catch … 売り文句（商品ごとに自由に書ける。黄色い帯で大きく表示）
   desc  … 補足説明
   同じ variant_group の行は、プルダウンで規格を選べる1商品にまとまります。
   スプレッドシートの列は catch を足すだけでOK（列名: catch）。 */
const SAMPLE = [
  {id:101,name:'防草シート',category:'草対策',icon:'🌿',price:5800,variant_group:'bousou',attr1_name:'幅',attr1_value:'1m×50m',spec:'1巻',catch:'草取りの回数がぐっと減ります。畑のあぜ道に。',desc:'光を通しにくい黒色。破れにくい丈夫なタイプです。'},
  {id:102,name:'防草シート',category:'草対策',icon:'🌿',price:10800,variant_group:'bousou',attr1_name:'幅',attr1_value:'2m×50m',spec:'1巻',catch:'草取りの回数がぐっと減ります。畑のあぜ道に。',desc:'光を通しにくい黒色。破れにくい丈夫なタイプです。'},
  {id:110,name:'マルチシート（黒）',category:'畑づくり',icon:'🥔',price:3200,variant_group:'multi',attr1_name:'幅',attr1_value:'95cm×200m',spec:'1巻',catch:'地温が上がり、雑草もおさえます。野菜の育ちがちがいます。',desc:'穴なしの黒マルチ。'},
  {id:111,name:'マルチシート（黒）',category:'畑づくり',icon:'🥔',price:3800,variant_group:'multi',attr1_name:'幅',attr1_value:'135cm×200m',spec:'1巻',catch:'地温が上がり、雑草もおさえます。野菜の育ちがちがいます。',desc:'穴なしの黒マルチ。'},
  {id:120,name:'ネット（防鳥・防獣）',category:'鳥獣対策',icon:'🐗',price:4200,variant_group:'net',attr1_name:'大きさ',attr1_value:'2m×50m',spec:'1巻',catch:'大事な作物を、鳥やけものから守ります。',desc:'細かい目で小さな鳥も通しません。'},
  {id:121,name:'ネット（防鳥・防獣）',category:'鳥獣対策',icon:'🐗',price:7800,variant_group:'net',attr1_name:'大きさ',attr1_value:'4m×50m',spec:'1巻',catch:'大事な作物を、鳥やけものから守ります。',desc:'細かい目で小さな鳥も通しません。'},
  {id:130,name:'コンテナ（収穫用）',category:'収穫・出荷',icon:'🧺',price:480,spec:'1個',catch:'重ねても崩れにくく、持ち運びがラクです。',desc:'水洗いできて清潔。'},
  {id:140,name:'ブルーシート',category:'養生・保管',icon:'🟦',price:2100,variant_group:'blue',attr1_name:'大きさ',attr1_value:'3.6×5.4m',spec:'#2000 厚手',catch:'肥料や資材の雨よけに。ひとつあると安心です。',desc:'丈夫な厚手タイプ。'},
  {id:141,name:'ブルーシート',category:'養生・保管',icon:'🟦',price:3600,variant_group:'blue',attr1_name:'大きさ',attr1_value:'5.4×7.2m',spec:'#2000 厚手',catch:'肥料や資材の雨よけに。ひとつあると安心です。',desc:'丈夫な厚手タイプ。'}
];

/* ===== 状態 ===== */
let all=[], items=[], cat='すべて', sel1={}, cart={}, qtys={};
const yen=n=>'¥'+(Number(n)||0).toLocaleString('ja-JP');
const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const $=id=>document.getElementById(id);
const label=p=>[p.attr1_value,p.attr2_value].filter(Boolean).join('・');

function build(){
  const gs={}; items=[];
  all.forEach(p=>{
    const g=(p.variant_group||'').toString().trim();
    if(!g){items.push({group:false,p});return}
    if(!gs[g]){gs[g]={group:true,id:g,vs:[],n1:p.attr1_name||'規格'};items.push(gs[g])}
    gs[g].vs.push(p);
  });
  Object.values(gs).forEach(g=>{
    g.opts=[...new Set(g.vs.map(v=>v.attr1_value))];
    if(!g.opts.includes(sel1[g.id]))sel1[g.id]=g.opts[0];
  });
}
const cur=it=>it.group?it.vs.find(v=>v.attr1_value===sel1[it.id]):it.p;
const catOf=it=>it.group?it.vs[0].category:it.p.category;

function renderCats(){
  const cs=['すべて',...new Set(items.map(catOf).filter(Boolean))];
  $('cats').innerHTML=cs.map(c=>`<button class="cat" aria-pressed="${c===cat}" onclick="setCat('${esc(c)}')">${esc(c)}</button>`).join('');
}
function setCat(c){cat=c;renderCats();renderGrid()}
function pick(g,v){sel1[g]=v;renderGrid()}

function renderGrid(){
  const list=items.filter(it=>cat==='すべて'||catOf(it)===cat);
  $('grid').innerHTML=list.map(it=>{
    const p=cur(it), base=it.group?it.vs[0]:it.p, inC=p&&!!cart[p.id];
    const q=p?(inC?cart[p.id].qty:(qtys[p.id]||1)):1;
    const photo=base.image_url?`<img src="${esc(base.image_url)}" alt="${esc(base.name)}" loading="lazy">`:`<span aria-hidden="true">${esc(base.icon||'📦')}</span>`;
    const sel=it.group?`<div class="field"><label for="s-${esc(it.id)}">${esc(it.n1)}を選んでください</label>
      <select id="s-${esc(it.id)}" onchange="pick('${esc(it.id)}',this.value)">${it.opts.map(o=>`<option value="${esc(o)}"${o===sel1[it.id]?' selected':''}>${esc(o)}</option>`).join('')}</select></div>`:'';
    return `<article class="card${inC?' in':''}">
      <div class="photo">${photo}</div>
      <div class="body">
        <h2 class="name">${esc(base.name)}</h2>
        ${base.catch?`<div class="pitch">${esc(base.catch)}</div>`:''}
        ${base.desc?`<p class="desc">${esc(base.desc)}</p>`:''}
        ${sel}
        ${p?`<div class="price">${yen(p.price)}<small>（税別）</small></div>${p.spec?`<div class="spec">${esc(p.spec)}</div>`:''}
        <div class="qty"><b>数量</b>
          <button class="qb" aria-label="1つ減らす" onclick="setQ(${p.id},${q}-1)">−</button>
          <input class="qn" type="number" min="1" value="${q}" aria-label="数量" onchange="setQ(${p.id},this.value)">
          <button class="qb" aria-label="1つ増やす" onclick="setQ(${p.id},${q}+1)">＋</button></div>`
        :`<div class="none">この組み合わせは、いま扱っていません。</div>`}
      </div>
      <div class="foot">
        ${base.link_url?`<a class="link" href="${esc(base.link_url)}" target="_blank" rel="noopener">くわしく見る</a>`:''}
        ${p?`<button class="btn${inC?' in':''}" onclick="toggle(${p.id})">${inC?'✓ カートに入っています（押すと取り消し）':'カートに入れる'}</button>`:'<button class="btn" disabled>選べません</button>'}
      </div></article>`;
  }).join('');
}

function setQ(id,v){
  const n=Math.max(1,Math.floor(Number(v))||1);
  if(cart[id])cart[id].qty=n;else qtys[id]=n;
  renderGrid();bar();if($('ov').classList.contains('open'))renderSum();
}
function toggle(id){
  const p=all.find(x=>x.id==id);
  if(cart[id]){delete cart[id];toast('カートから出しました')}
  else{cart[id]={p,qty:qtys[id]||1};toast('カートに入れました')}
  renderGrid();bar();
}
const sub=()=>Object.values(cart).reduce((s,e)=>s+e.p.price*e.qty,0);
const tax=()=>Math.round(sub()*TAX);
function bar(){
  const n=Object.keys(cart).length;
  $('barText').textContent=n?`${n}種類　${yen(sub()+tax())}（税込）`:'まだ入っていません';
}
function renderSum(){
  const es=Object.values(cart);
  $('sum').innerHTML=es.map(({p,qty})=>`<div class="row"><div><div class="n">${esc(p.name)}</div>
    <div>${esc([label(p),p.spec].filter(Boolean).join('　'))}</div><div>${yen(p.price)} × ${qty}</div>
    <button class="del" onclick="toggle(${p.id});renderSum();if(!Object.keys(cart).length)closeForm()">これをやめる</button></div>
    <div class="t">${yen(p.price*qty)}</div></div>`).join('')+
    `<div class="sub" style="margin-top:10px"><span>小計（税別）</span><span>${yen(sub())}</span></div>
     <div class="sub"><span>消費税（10%）</span><span>${yen(tax())}</span></div>
     <div class="tot"><span>合計（税込）</span><span>${yen(sub()+tax())}</span></div>`;
}
function openForm(){
  if(!Object.keys(cart).length){toast('先に「カートに入れる」を押してください');return}
  renderSum();$('ov').classList.add('open');$('ov').scrollTop=0;
}
function closeForm(){$('ov').classList.remove('open')}

function submitOrder(){
  const v=id=>$(id).value.trim();
  if(!v('fCompany')){toast('会社名・屋号を入れてください');return}
  if(!v('fName')){toast('ご担当者名を入れてください');return}
  if(!v('fEmail')){toast('メールアドレスを入れてください');return}
  const es=Object.values(cart);
  const payload={order_id:'ORD-'+Date.now(),company:v('fCompany'),name:v('fName'),email:v('fEmail'),tel:v('fTel'),address:v('fAddress'),note:v('fNote'),
    items:es.map(({p,qty})=>({id:p.id,name:p.name,variant_label:label(p),spec:p.spec||'',qty,unit_price:p.price,line_total:p.price*qty})),
    subtotal:sub(),tax:tax(),total:sub()+tax()};
  const done=()=>{closeForm();cart={};qtys={};renderGrid();bar();toast('ご注文を受け付けました。ありがとうございます')};
  if(CONFIG.GAS_URL){
    fetch(CONFIG.GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)})
      .then(done).catch(()=>toast('送れませんでした。もう一度お試しください'));
  }else{console.log('注文（GAS未設定）',payload);done()}
}
function toast(m){const t=$('toast');t.textContent=m;t.className='toast show';clearTimeout(t._t);t._t=setTimeout(()=>t.className='toast',3000)}

async function init(){
  $('coName').textContent=COMPANY.name;$('coTel').textContent=COMPANY.tel;$('coHours').textContent=COMPANY.hours;
  $('coFoot').innerHTML=`${esc(COMPANY.address)}<br>${esc(COMPANY.email)}<br><a href="tokutei.html">特定商取引法に基づく表記</a>`;
  all=SAMPLE;
  if(CONFIG.GAS_URL){
    try{const d=await (await fetch(CONFIG.GAS_URL)).json();const l=Array.isArray(d)?d:d.products;
      if(Array.isArray(l)&&l.length)all=l.map(p=>({...p,price:Number(p.price)}))}catch(e){}
  }
  build();renderCats();renderGrid();bar();
}
init();
</script>
</body>
</html>
