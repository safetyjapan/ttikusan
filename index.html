<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>資材のご注文 — セーフティージャパン株式会社</title>
<style>
:root{
  --bg:#FBF8F0; --surface:#FFFFFF; --text:#1B1B1B; --sub:#3D3D3D;
  --border:#8A8272; --green:#1F6B35; --green-dk:#154D26; --green-lt:#E4F2E7;
  --amber:#FFE9A8; --amber-tx:#5A3B00; --red:#B3261E;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{font-size:20px}
body{font-family:"Hiragino Kaku Gothic ProN","Meiryo","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text);line-height:1.8;padding-bottom:110px}
a{color:var(--green-dk)}
button,select,input,textarea{font:inherit}
:focus-visible{outline:4px solid #0B57D0;outline-offset:2px}

header{background:var(--green);color:#fff;padding:18px 20px;border-bottom:6px solid var(--amber)}
.wrap{max-width:900px;margin:0 auto}
.h-name{font-size:1.3rem;font-weight:900}
.h-tel{font-size:1.5rem;font-weight:900;margin-top:4px}
.h-tel small{font-size:.85rem;font-weight:500;margin-left:8px}
.lead{background:var(--surface);border-bottom:2px solid var(--border);padding:22px 20px}
.lead h1{font-size:1.6rem;line-height:1.5;color:var(--green-dk)}
.lead p{margin-top:8px;font-size:1.05rem}

.cats{display:flex;flex-wrap:wrap;gap:10px;padding:18px 0 6px}
.cat{min-height:56px;padding:8px 20px;font-weight:700;border:3px solid var(--green);background:#fff;color:var(--green-dk);border-radius:12px;cursor:pointer}
.cat[aria-pressed="true"]{background:var(--green);color:#fff}

.grid{display:grid;gap:22px;padding:14px 0}
.card{background:var(--surface);border:3px solid var(--border);border-radius:16px;overflow:hidden}
.card.in{border-color:var(--green);box-shadow:0 0 0 4px var(--green-lt)}
.photo{height:210px;background:var(--green-lt);display:flex;align-items:center;justify-content:center;font-size:5rem}
.photo img{width:100%;height:100%;object-fit:contain;background:#fff}
.body{padding:18px 18px 8px}
.name{font-size:1.45rem;font-weight:900;line-height:1.4}
.pitch{margin-top:10px;padding:12px 14px;background:var(--amber);color:var(--amber-tx);font-size:1.15rem;font-weight:700;border-radius:10px;line-height:1.6}
.desc{margin-top:10px;font-size:1.05rem;color:var(--sub)}
.field{margin-top:14px}
.field label{display:block;font-weight:700;font-size:1rem;margin-bottom:4px}
select{width:100%;min-height:56px;padding:8px 12px;border:3px solid var(--border);border-radius:10px;background:#fff;font-size:1.1rem;font-weight:700}
.price{margin-top:14px;font-size:2rem;font-weight:900;color:var(--green-dk)}
.price small{font-size:1rem;font-weight:700;color:var(--sub);margin-left:4px}
.spec{font-size:1rem;color:var(--sub)}
.none{margin-top:14px;font-weight:900;color:var(--red);font-size:1.1rem}
.qty{display:flex;align-items:center;gap:10px;margin-top:14px}
.qty b{font-size:1.1rem;margin-right:4px}
.qb{width:60px;height:60px;border:3px solid var(--green);background:#fff;color:var(--green-dk);font-size:1.9rem;font-weight:900;border-radius:12px;cursor:pointer}
.qn{width:84px;height:60px;text-align:center;border:3px solid var(--border);border-radius:12px;font-size:1.5rem;font-weight:900}
.foot{padding:12px 18px 18px;display:grid;gap:10px}
.btn{min-height:64px;width:100%;border:none;border-radius:14px;font-size:1.25rem;font-weight:900;cursor:pointer;background:var(--green);color:#fff}
.btn:hover{background:var(--green-dk)}
.btn.in{background:#fff;color:var(--green-dk);border:3px solid var(--green)}
.btn:disabled{background:#CFCFCF;color:#555;cursor:not-allowed}
.link{display:block;text-align:center;padding:14px;font-weight:700;border:3px solid var(--border);border-radius:14px;text-decoration:none;color:var(--text)}

/* 画面下の固定カートバー */
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:4px solid var(--green);padding:10px 16px;z-index:50}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
.bar-info{font-weight:900;font-size:1.15rem}
.bar-info span{display:block;font-size:.9rem;font-weight:500;color:var(--sub)}
.bar .btn{width:auto;min-width:190px;padding:0 20px}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:16px}
.ov.open{display:flex}
.modal{background:#fff;border-radius:16px;max-width:640px;width:100%;padding:22px}
.modal h2{font-size:1.5rem;color:var(--green-dk);margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:2px dashed var(--border);font-size:1.05rem}
.row .n{font-weight:900}
.row .t{font-weight:900;white-space:nowrap}
.del{margin-top:6px;min-height:48px;padding:0 16px;border:3px solid var(--red);color:var(--red);background:#fff;border-radius:10px;font-weight:700;cursor:pointer}
.tot{display:flex;justify-content:space-between;font-size:1.5rem;font-weight:900;padding:14px 0;color:var(--green-dk)}
.sub{display:flex;justify-content:space-between;font-size:1rem;color:var(--sub)}
.f{margin-top:14px}
.f label{display:block;font-weight:900;margin-bottom:4px}
.req{background:var(--red);color:#fff;font-size:.8rem;padding:2px 8px;border-radius:6px;margin-left:6px}
.f input,.f textarea{width:100%;min-height:56px;padding:10px 12px;border:3px solid var(--border);border-radius:10px;font-size:1.1rem}
.f textarea{min-height:100px}
.btns{display:grid;gap:10px;margin-top:18px}
.btn.gray{background:#fff;color:var(--text);border:3px solid var(--border)}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:#222;color:#fff;font-weight:900;font-size:1.1rem;padding:16px 24px;border-radius:12px;z-index:200;display:none;max-width:90vw;text-align:center}
.toast.show{display:block}
footer{padding:24px 20px;font-size:1rem;color:var(--sub);text-align:center}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="h-name" id="coName"></div>
  <div class="h-tel">📞 <span id="coTel"></span><small id="coHours"></small></div>
</div></header>

<section class="lead"><div class="wrap">
  <h1 id="leadTitle">必要な資材を、そのまま注文できます。</h1>
  <p id="leadText">下の「カートに入れる」を押して、いちばん下の「注文へ進む」を押すだけです。わからないときは、上のお電話番号までどうぞ。</p>
</div></section>

<main class="wrap">
  <div class="cats" id="cats" role="group" aria-label="商品の種類"></div>
  <div class="grid" id="grid"></div>
</main>

<footer id="coFoot"></footer>

<div class="bar"><div class="wrap">
  <div class="bar-info"><span>カートの中身</span><b id="barText">0点</b></div>
  <button class="btn" onclick="openForm()">注文へ進む</button>
</div></div>

<div class="ov" id="ov"><div class="modal">
  <h2>ご注文の内容</h2>
  <div id="sum"></div>
  <div class="f"><label>会社名・屋号（お名前でも可）<span class="req">必須</span></label><input id="fCompany" autocomplete="organization"></div>
  <div class="f"><label>ご担当者名<span class="req">必須</span></label><input id="fName" autocomplete="name"></div>
  <div class="f"><label>メールアドレス<span class="req">必須</span></label><input id="fEmail" type="email" autocomplete="email"></div>
  <div class="f"><label>お電話番号</label><input id="fTel" type="tel" autocomplete="tel"></div>
  <div class="f"><label>お届け先の住所</label><input id="fAddress" autocomplete="street-address"></div>
  <div class="f"><label>ご希望の日・ひとこと</label><textarea id="fNote"></textarea></div>
  <div class="btns">
    <button class="btn" onclick="submitOrder()">この内容で注文する</button>
    <button class="btn gray" onclick="closeForm()">戻って商品を見る</button>
  </div>
</div></div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ===== 設定 ===== */
// Apps Script を公開した /exec のURLを入れてください。空欄のあいだはサンプルを表示します。
const CONFIG = { GAS_URL: 'https://script.google.com/macros/s/AKfycbxn-WWcpQ1Y_Yhha7BIz4AKqcoW5FkLglWpMiqj41RGmMinaVx2KSOg5n6dTWWiQapW/exec' };
let TAX = 0.10;
const SAMPLE = {"settings": {"company_name": "セーフティージャパン株式会社", "tel": "0995-57-7171", "hours": "平日9時～17時", "address": "〒899-4302　鹿児島県霧島市国分台明寺字下村777-7", "email": "safetyjapan.mk@gmail.com", "tax_rate": 0.1, "lead_title": "農家のみなさまへ。\n必要な資材を、そのまま注文できます。", "lead_text": "下の「カートに入れる」を押して、いちばん下の「注文へ進む」を押すだけです。わからないときは、上のお電話番号までどうぞ。"}, "products": [{"id": "P001", "name": "防草シート", "category": "草対策", "catch": "草取りの回数が、ぐっと減ります。あぜ道・果樹園の足もとに。", "desc": "光を通しにくい黒色。破れにくく、数年使えます。", "image_url": "", "icon": "🌿", "label1": "幅", "label2": "長さ", "link_url": "", "consult": false, "variants": [{"v1": "1m", "v2": "50m", "price": 5800, "spec": "1巻", "stock": "○"}, {"v1": "1m", "v2": "100m", "price": 10800, "spec": "1巻", "stock": "○"}, {"v1": "2m", "v2": "50m", "price": 10800, "spec": "1巻", "stock": "○"}, {"v1": "2m", "v2": "100m", "price": 19800, "spec": "1巻", "stock": "△"}]}, {"id": "P002", "name": "マルチシート（黒）", "category": "畑づくり", "catch": "地温が上がり、雑草もおさえます。野菜の育ちがちがいます。", "desc": "穴なしの黒マルチ。", "image_url": "", "icon": "🥔", "label1": "幅", "label2": "", "link_url": "", "consult": false, "variants": [{"v1": "95cm", "v2": "", "price": 3200, "spec": "200m巻", "stock": "○"}, {"v1": "135cm", "v2": "", "price": 3800, "spec": "200m巻", "stock": "○"}, {"v1": "150cm", "v2": "", "price": 4200, "spec": "200m巻", "stock": "×"}]}, {"id": "P003", "name": "防鳥・防獣ネット", "category": "鳥獣対策", "catch": "大事な作物を、鳥やけものから守ります。", "desc": "細かい目で小さな鳥も通しません。", "image_url": "", "icon": "🐗", "label1": "大きさ", "label2": "", "link_url": "", "consult": false, "variants": [{"v1": "2m×50m", "v2": "", "price": 4200, "spec": "1巻", "stock": "○"}, {"v1": "4m×50m", "v2": "", "price": 7800, "spec": "1巻", "stock": "○"}]}, {"id": "P004", "name": "収穫コンテナ", "category": "収穫・出荷", "catch": "重ねても崩れにくく、持ち運びがラクです。", "desc": "水洗いできて清潔。", "image_url": "", "icon": "🧺", "label1": "", "label2": "", "link_url": "", "consult": false, "variants": [{"v1": "", "v2": "", "price": 480, "spec": "1個", "stock": "○"}]}, {"id": "P005", "name": "ブルーシート", "category": "養生・保管", "catch": "肥料や資材の雨よけに。ひとつあると安心です。", "desc": "丈夫な厚手タイプ。", "image_url": "", "icon": "🟦", "label1": "厚さ", "label2": "大きさ", "link_url": "", "consult": false, "variants": [{"v1": "#2000", "v2": "3.6×5.4m", "price": 3600, "spec": "", "stock": "○"}, {"v1": "#2000", "v2": "5.4×7.2m", "price": 5200, "spec": "", "stock": "○"}, {"v1": "#3000", "v2": "3.6×5.4m", "price": 6200, "spec": "", "stock": "○"}, {"v1": "#3000", "v2": "5.4×7.2m", "price": 8800, "spec": "", "stock": "○"}]}, {"id": "P006", "name": "支柱（合成）", "category": "畑づくり", "catch": "トマト・きゅうりの支えに。さびず、長持ちします。", "desc": "", "image_url": "", "icon": "🌱", "label1": "太さ", "label2": "長さ", "link_url": "", "consult": false, "variants": [{"v1": "11mm", "v2": "1.5m", "price": 980, "spec": "10本", "stock": "○"}, {"v1": "11mm", "v2": "1.8m", "price": 1180, "spec": "10本", "stock": "○"}, {"v1": "16mm", "v2": "1.8m", "price": 1580, "spec": "10本", "stock": "○"}, {"v1": "16mm", "v2": "2.1m", "price": 1880, "spec": "10本", "stock": "○"}]}, {"id": "P007", "name": "ビニールハウス用フィルム", "category": "畑づくり", "catch": "ハウスの大きさに合わせて、お見積りします。", "desc": "厚み・幅・長さをご相談ください。", "image_url": "", "icon": "🏠", "label1": "", "label2": "", "link_url": "", "consult": true, "variants": [{"v1": "", "v2": "", "price": null, "spec": "", "stock": "○"}]}]};
let DATA = SAMPLE, all = [], cat = 'すべて', sel1 = {}, sel2 = {}, cart = {}, qtys = {}, TEL = '';
const yen = n => '¥' + (Number(n) || 0).toLocaleString('ja-JP');
const esc = s => (s == null ? '' : String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const $ = id => document.getElementById(id);
const vlabel = v => [v.v1, v.v2].filter(Boolean).join('・');
const keyOf = (p, v) => p.id + '|' + v.v1 + '|' + v.v2;
const opts1 = p => [...new Set(p.variants.map(v => v.v1))];
const opts2 = p => [...new Set(p.variants.filter(v => v.v1 === sel1[p.id]).map(v => v.v2))];
function fix(p){
  const o1 = opts1(p); if (!o1.includes(sel1[p.id])) sel1[p.id] = o1[0];
  const o2 = opts2(p); if (!o2.includes(sel2[p.id])) sel2[p.id] = o2[0];
}
const curV = p => p.variants.find(v => v.v1 === sel1[p.id] && v.v2 === sel2[p.id]);

function renderCats(){
  const cs = ['すべて', ...new Set(all.map(p => p.category).filter(Boolean))];
  $('cats').innerHTML = cs.map(c => `<button class="cat" aria-pressed="${c===cat}" onclick="setCat(${JSON.stringify(c).replace(/"/g,'&quot;')})">${esc(c)}</button>`).join('');
}
function setCat(c){ cat = c; renderCats(); renderGrid(); }
function pick(i, n, val){ const p = all[i]; (n === 1 ? sel1 : sel2)[p.id] = val; fix(p); renderGrid(); }

function renderGrid(){
  $('grid').innerHTML = all.map((p, i) => {
    if (cat !== 'すべて' && p.category !== cat) return '';
    const v = curV(p), k = v ? keyOf(p, v) : '', inC = !!cart[k];
    const q = inC ? cart[k].qty : (qtys[k] || 1);
    const photo = p.image_url ? `<img src="${esc(p.image_url)}" alt="${esc(p.name)}" loading="lazy">` : `<span aria-hidden="true">${esc(p.icon || '📦')}</span>`;
    const sel = (n, label, list, cur) => label && list.length ? `<div class="field"><label for="s${n}-${i}">${esc(label)}を選んでください</label>
      <select id="s${n}-${i}" onchange="pick(${i},${n},this.value)">${list.map(o => `<option value="${esc(o)}"${o===cur?' selected':''}>${esc(o)}</option>`).join('')}</select></div>` : '';
    const call = p.consult || (v && v.price == null);
    let mid = '', btn = '';
    if (!v){ mid = '<div class="none">この組み合わせは、いま扱っていません。</div>'; btn = '<button class="btn" disabled>選べません</button>'; }
    else if (call){
      mid = '<div class="price" style="font-size:1.3rem">価格はお電話でご相談ください</div>' + (v.spec ? `<div class="spec">${esc(v.spec)}</div>` : '');
      btn = `<a class="btn" style="display:flex;align-items:center;justify-content:center;text-decoration:none" href="tel:${esc(TEL.replace(/[^0-9+]/g,''))}">📞 電話で相談する（${esc(TEL)}）</a>`;
    } else {
      mid = `<div class="price">${yen(v.price)}<small>（税別）</small></div>${v.spec ? `<div class="spec">${esc(v.spec)}</div>` : ''}${v.stock === '△' ? '<div class="none" style="color:var(--amber-tx)">残りわずかです</div>' : ''}`;
      if (v.stock === '×') btn = '<button class="btn" disabled>品切れ中です</button>';
      else {
        mid += `<div class="qty"><b>数量</b>
          <button class="qb" aria-label="1つ減らす" onclick="setQ(${i},${q}-1)">−</button>
          <input class="qn" type="number" min="1" value="${q}" aria-label="数量" onchange="setQ(${i},this.value)">
          <button class="qb" aria-label="1つ増やす" onclick="setQ(${i},${q}+1)">＋</button></div>`;
        btn = `<button class="btn${inC?' in':''}" onclick="toggle(${i})">${inC ? '✓ カートに入っています（押すと取り消し）' : 'カートに入れる'}</button>`;
      }
    }
    return `<article class="card${inC?' in':''}"><div class="photo">${photo}</div><div class="body">
      <h2 class="name">${esc(p.name)}</h2>
      ${p.catch ? `<div class="pitch">${esc(p.catch)}</div>` : ''}
      ${p.desc ? `<p class="desc">${esc(p.desc)}</p>` : ''}
      ${sel(1, p.label1, opts1(p), sel1[p.id])}${sel(2, p.label2, opts2(p), sel2[p.id])}${mid}</div>
      <div class="foot">${p.link_url ? `<a class="link" href="${esc(p.link_url)}" target="_blank" rel="noopener">くわしく見る</a>` : ''}${btn}</div></article>`;
  }).join('');
}

function setQ(i, val){
  const p = all[i], v = curV(p); if (!v) return; const k = keyOf(p, v);
  const n = Math.max(1, Math.floor(Number(val)) || 1);
  if (cart[k]) cart[k].qty = n; else qtys[k] = n;
  renderGrid(); bar(); if ($('ov').classList.contains('open')) renderSum();
}
function toggle(i){
  const p = all[i], v = curV(p), k = keyOf(p, v);
  if (cart[k]){ delete cart[k]; toast('カートから出しました'); }
  else { cart[k] = { p, v, qty: qtys[k] || 1 }; toast('カートに入れました'); }
  renderGrid(); bar();
}
function delK(k){ delete cart[decodeURIComponent(k)]; renderGrid(); bar(); if (!Object.keys(cart).length) closeForm(); else renderSum(); }
const sub = () => Object.values(cart).reduce((s, e) => s + e.v.price * e.qty, 0);
const tax = () => Math.round(sub() * TAX);
function bar(){
  const n = Object.keys(cart).length;
  $('barText').textContent = n ? `${n}種類　${yen(sub() + tax())}（税込）` : 'まだ入っていません';
}
function renderSum(){
  $('sum').innerHTML = Object.entries(cart).map(([k, { p, v, qty }]) => `<div class="row"><div><div class="n">${esc(p.name)}</div>
    <div>${esc([vlabel(v), v.spec].filter(Boolean).join('　'))}</div><div>${yen(v.price)} × ${qty}</div>
    <button class="del" onclick="delK('${encodeURIComponent(k)}')">これをやめる</button></div><div class="t">${yen(v.price * qty)}</div></div>`).join('') +
    `<div class="sub" style="margin-top:10px"><span>小計（税別）</span><span>${yen(sub())}</span></div>
     <div class="sub"><span>消費税（${Math.round(TAX*100)}%）</span><span>${yen(tax())}</span></div>
     <div class="tot"><span>合計（税込）</span><span>${yen(sub() + tax())}</span></div>`;
}
function openForm(){
  if (!Object.keys(cart).length){ toast('先に「カートに入れる」を押してください'); return; }
  renderSum(); $('ov').classList.add('open'); $('ov').scrollTop = 0;
}
function closeForm(){ $('ov').classList.remove('open'); }

function submitOrder(){
  const g = id => $(id).value.trim();
  if (!g('fCompany')){ toast('会社名・屋号を入れてください'); return; }
  if (!g('fName')){ toast('ご担当者名を入れてください'); return; }
  if (!g('fEmail')){ toast('メールアドレスを入れてください'); return; }
  const es = Object.values(cart);
  const payload = { order_id: 'ORD-' + Date.now(), company: g('fCompany'), name: g('fName'), email: g('fEmail'), tel: g('fTel'), address: g('fAddress'), note: g('fNote'),
    items: es.map(({ p, v, qty }) => ({ product_id: p.id, name: p.name, variant_label: vlabel(v), spec: v.spec, qty, unit_price: v.price, line_total: v.price * qty })),
    subtotal: sub(), tax: tax(), total: sub() + tax() };
  const done = () => { closeForm(); cart = {}; qtys = {}; renderGrid(); bar(); toast('ご注文を受け付けました。ありがとうございます'); };
  if (CONFIG.GAS_URL){
    fetch(CONFIG.GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) })
      .then(done).catch(() => toast('送れませんでした。もう一度お試しください'));
  } else { console.log('注文（GAS未設定）', payload); done(); }
}
function toast(m){ const t = $('toast'); t.textContent = m; t.className = 'toast show'; clearTimeout(t._t); t._t = setTimeout(() => t.className = 'toast', 3000); }

async function init(){
  if (CONFIG.GAS_URL){
    try { const d = await (await fetch(CONFIG.GAS_URL)).json(); if (d && Array.isArray(d.products) && d.products.length) DATA = d; } catch (e) {}
  }
  const s = DATA.settings || {};
  const t = Number(String(s.tax_rate || '').replace('%', '')); if (t > 0) TAX = t > 1 ? t / 100 : t;
  TEL = s.tel || ''; document.title = (s.company_name || '') + ' 資材のご注文';
  $('coName').textContent = s.company_name || ''; $('coTel').textContent = TEL; $('coHours').textContent = s.hours || '';
  if (s.lead_title) $('leadTitle').innerHTML = esc(s.lead_title).replace(/\n/g, '<br>');
  if (s.lead_text) $('leadText').textContent = s.lead_text;
  $('coFoot').innerHTML = `${esc(s.address)}<br>${esc(s.email)}<br><a href="tokutei.html">特定商取引法に基づく表記</a>`;
  all = DATA.products.map(p => ({ ...p, consult: p.consult === true || p.consult === '○', variants: (p.variants || []).map(v => ({
    v1: v.v1 || '', v2: v.v2 || '', price: v.price === '' || v.price == null ? null : Number(v.price), spec: v.spec || '', stock: v.stock || '○' })) })).filter(p => p.variants.length);
  all.forEach(fix); renderCats(); renderGrid(); bar();
}
init();
</script>
